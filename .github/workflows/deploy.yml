name: Cloudflare Workers CI

on:
  push:
    branches: [dev, prod]
    paths:
      - 'src/**'
      - 'migrations/**'
      - 'package*.json'
      - 'wrangler.jsonc'
      - '.github/workflows/deploy.yml'
  pull_request:
    branches: [dev, prod]
    paths:
      - 'src/**'
      - 'migrations/**'
      - 'package*.json'
      - 'wrangler.jsonc'
      - '.github/workflows/deploy.yml'

jobs:
  deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps: 
      - name: get latest code
        uses: actions/checkout@v4
      
      - name: set up node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: install dependencies
        run: npm ci

      - name: type check
        run: npx tsc --noEmit

      - name: apply database migrations
        run: npx wrangler d1 migrations apply brain-${{ github.ref_name }} --remote --env ${{ github.ref_name }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}

      - name: deploy worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CF_API_KEY }}
          accountId: ${{ vars.CF_ACCOUNT_ID }}
          environment: ${{ github.ref_name }}
          secrets: |
            INVITE_CODE
          vars: |
            SESSION_TTL_SECONDS
        env:
          INVITE_CODE: ${{ secrets.INVITE_CODE }}
          SESSION_TTL_SECONDS: ${{ vars.SESSION_TTL_SECONDS }}
